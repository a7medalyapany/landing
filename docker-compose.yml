# Local development.
#   docker compose up -d postgres   → just the database; run `pnpm dev` on your machine
#   docker compose up               → database + the app in a Node container
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d landing']
      interval: 5s
      timeout: 5s
      retries: 10

  payload:
    image: docker.io/library/node:22.23.4-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the container the database is reachable by its service name, not 127.0.0.1.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/landing

volumes:
  pgdata:
  node_modules:
